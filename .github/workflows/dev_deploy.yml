name: Dev Deploy

on:
  push:
    branches: [ 'dev' ]

jobs:
  push_to_registry:
    runs-on: ubicloud

    steps:
    - name: Check out the repo
      uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

    - name: Set up QEMU
      uses: docker/setup-qemu-action@27d0a4f181a40b142cce983c5393082c365d1480 # v1
      with:
        platforms: all

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@b2391d37b4157fa4aa2e118d643f417910ff3242 # v3
      with:
        images: |
          slatedocs/slate
        tags: |
          type=ref,event=branch

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1

    - name: Login to DockerHub
      uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_KEY }}

    - name: Push to Docker Hub
      uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a # v2
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64,linux/ppc64le
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy_gh:
    permissions:
      contents: write

    runs-on: ubicloud
    env:
      ruby-version: 3.2

    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
    - name: Set up Ruby
      uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1
      with:
        ruby-version: ${{ env.ruby-version }}

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: vendor/bundle
        key: gems-${{ runner.os }}-${{ env.ruby-version }}-${{ hashFiles('**/Gemfile.lock') }}
        restore-keys: |
          gems-${{ runner.os }}-${{ env.ruby-version }}-
          gems-${{ runner.os }}-
    - run: bundle config set deployment 'true'
    - name: bundle install
      run: |
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3
    - run: bundle exec middleman build

    - name: Deploy
      uses: peaceiris/actions-gh-pages@05a7c4edd9040cd807b15e6ca8a52fcab5cc0a17 # v3.7.0-8
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        destination_dir: dev
        publish_dir: ./build
        keep_files: true
